spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:300}
      min-spare: ${SERVER_MIN_SPARE_THREADS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

app:
  auth:
    admin-token: ${ADMIN_TOKEN:admin-token}
  reservation:
    default-per-user-limit: ${DEFAULT_PER_USER_LIMIT:4}

