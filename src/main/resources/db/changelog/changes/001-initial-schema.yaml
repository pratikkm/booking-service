databaseChangeLog:
  - changeSet:
      id: 001-create-shows
      author: ticketing
      changes:
        - createTable:
            tableName: shows
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: price_paise
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: per_user_limit
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE shows ADD CONSTRAINT ck_shows_price_nonnegative CHECK (price_paise >= 0)
        - sql:
            sql: ALTER TABLE shows ADD CONSTRAINT ck_shows_per_user_limit_positive CHECK (per_user_limit > 0)

  - changeSet:
      id: 002-create-show-seats
      author: ticketing
      changes:
        - createTable:
            tableName: show_seats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: show_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: seat_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: show_seats
            baseColumnNames: show_id
            referencedTableName: shows
            referencedColumnNames: id
            constraintName: fk_show_seats_show
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: show_seats
            columnNames: show_id, seat_number
            constraintName: uk_show_seats_show_seat
        - sql:
            sql: ALTER TABLE show_seats ADD CONSTRAINT ck_show_seats_status CHECK (status IN ('AVAILABLE', 'CONFIRMED'))
        - createIndex:
            tableName: show_seats
            indexName: idx_show_seats_show_status
            columns:
              - column:
                  name: show_id
              - column:
                  name: status

  - changeSet:
      id: 003-create-reservations
      author: ticketing
      changes:
        - createTable:
            tableName: reservations
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: show_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: amount_paise
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false
              - column:
                  name: cancelled_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: reservations
            baseColumnNames: show_id
            referencedTableName: shows
            referencedColumnNames: id
            constraintName: fk_reservations_show
        - sql:
            sql: ALTER TABLE reservations ADD CONSTRAINT ck_reservations_amount_nonnegative CHECK (amount_paise >= 0)
        - sql:
            sql: ALTER TABLE reservations ADD CONSTRAINT ck_reservations_status CHECK (status IN ('CONFIRMED', 'CANCELLED'))
        - createIndex:
            tableName: reservations
            indexName: idx_reservations_show_user_status
            columns:
              - column:
                  name: show_id
              - column:
                  name: user_id
              - column:
                  name: status

  - changeSet:
      id: 004-create-reservation-seats
      author: ticketing
      changes:
        - createTable:
            tableName: reservation_seats
            columns:
              - column:
                  name: reservation_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: show_seat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: seat_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: reservation_seats
            columnNames: reservation_id, show_seat_id
            constraintName: pk_reservation_seats
        - addUniqueConstraint:
            tableName: reservation_seats
            columnNames: show_seat_id
            constraintName: uk_reservation_seats_show_seat
        - addForeignKeyConstraint:
            baseTableName: reservation_seats
            baseColumnNames: reservation_id
            referencedTableName: reservations
            referencedColumnNames: id
            constraintName: fk_reservation_seats_reservation
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: reservation_seats
            baseColumnNames: show_seat_id
            referencedTableName: show_seats
            referencedColumnNames: id
            constraintName: fk_reservation_seats_show_seat
        - createIndex:
            tableName: reservation_seats
            indexName: idx_reservation_seats_seat
            columns:
              - column:
                  name: show_seat_id

  - changeSet:
      id: 005-create-idempotency
      author: ticketing
      changes:
        - createTable:
            tableName: idempotency_keys
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: show_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: response_status
                  type: INT
              - column:
                  name: reservation_id
                  type: UUID
              - column:
                  name: response_body
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: idempotency_keys
            baseColumnNames: show_id
            referencedTableName: shows
            referencedColumnNames: id
            constraintName: fk_idempotency_show
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: idempotency_keys
            columnNames: show_id, user_id, idempotency_key
            constraintName: uk_idempotency_scope
