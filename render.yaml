services:
  - type: web
    name: booking-service
    runtime: docker
    healthCheckPath: /ready
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ticketing-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ticketing-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ticketing-db
          property: password
      - key: ADMIN_TOKEN
        sync: false
      - key: SERVER_MAX_THREADS
        value: "100"
      - key: DB_POOL_SIZE
        value: "10"

databases:
  - name: ticketing-db
    databaseName: ticketing
    user: ticketing
    plan: free
