services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketing"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ticketing
      DB_USER: postgres
      DB_PASSWORD: postgres
      ADMIN_TOKEN: admin-token
      DB_POOL_SIZE: 40
      SERVER_MAX_THREADS: 300
    ports:
      - "8080:8080"
